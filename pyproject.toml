[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-graphics"
version = "0.1.0a1"
description = "Open workflows for agent-driven visual creation, graphics production, and reproducible pipelines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Agentic_Graphics contributors" }]
keywords = ["agents", "llm", "graphics", "blender", "unreal-engine", "procedural-generation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "jsonschema>=4.18,<5",
  "PyYAML>=6,<7",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.urls]
Homepage = "https://ka1y0.github.io/Agentic_Graphics/"
Repository = "https://github.com/Ka1y0/Agentic_Graphics"
Issues = "https://github.com/Ka1y0/Agentic_Graphics/issues"

[project.scripts]
agfx = "agentic_graphics.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_graphics = ["py.typed"]

[tool.setuptools.data-files]
"share/agentic-graphics" = ["agentic-graphics.example.toml"]
"share/agentic-graphics/examples" = ["examples/crate.yaml", "examples/procedural-chair.yaml"]
"share/agentic-graphics/schemas" = ["schemas/graphics-spec.schema.json"]
"share/agentic-graphics/scripts/blender" = [
  "scripts/blender/generate_asset.py",
  "scripts/blender/process_asset.py",
  "scripts/blender/validate_asset.py",
]
"share/agentic-graphics/scripts/unreal" = ["scripts/unreal/import_asset.py"]
