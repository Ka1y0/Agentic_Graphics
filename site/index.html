<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Agentic_Graphics is an open ecosystem for agent-driven visual creation, realtime rendering, world building, and reproducible graphics workflows." />
    <meta name="theme-color" content="#071522" />
    <title>Agentic_Graphics</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="Agentic_Graphics home">Agentic_Graphics</a>
      <a class="text-link" href="https://github.com/Ka1y0/Agentic_Graphics">View GitHub <span aria-hidden="true">↗</span></a>
    </header>

    <main>
      <section class="hero" aria-labelledby="title">
        <div class="hero-copy">
          <h1 id="title">Agentic_Graphics</h1>
          <p class="tagline">Open agent-driven graphics ecosystem.</p>

          <div class="featured">
            <p class="section-label">Featured World</p>
            <h2>Pixel Harbor</h2>
          </div>

          <div class="actions">
            <a class="button button-primary" href="./pixel-harbor/">Launch Pixel Harbor <span aria-hidden="true">→</span></a>
            <a class="button button-secondary" href="https://github.com/Ka1y0/Agentic_Graphics">View GitHub <span aria-hidden="true">↗</span></a>
          </div>
        </div>

        <a class="hero-media" href="./pixel-harbor/" aria-label="Launch Pixel Harbor">
          <img src="./assets/pixel-harbor-hero.png" alt="Pixel Harbor in its canonical 2D Ukiyo-e Pixel view" width="1440" height="900" />
        </a>
      </section>
    </main>

    <footer>
      <span>© 2026 Agentic_Graphics</span>
      <span>Open source under the MIT License</span>
    </footer>
  </body>
</html>
